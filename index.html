<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shared Life - Simple Version</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    
    h1 {
      color: #333;
      text-align: center;
      margin-bottom: 30px;
    }
    
    .tab-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
    }
    
    .tab-btn {
      padding: 10px 20px;
      border: none;
      background: #f0f0f0;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    
    .tab-btn.active {
      background: #4CAF50;
      color: white;
    }
    
    .tab-content {
      display: none;
      padding: 20px;
      border: 1px solid #eee;
      border-radius: 5px;
      background: #fafafa;
    }
    
    .tab-content.active {
      display: block;
    }
    
    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 16px;
    }
    
    button {
      padding: 10px 20px;
      background: #2196F3;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    
    button:hover {
      background: #1976D2;
    }
    
    .debug-info {
      margin-top: 30px;
      padding: 15px;
      background: #fff3cd;
      border: 1px solid #ffeaa7;
      border-radius: 5px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container" id="app">
    <h1>Shared Life - Simple Version</h1>
    
    <div class="debug-info" id="debug-info">
      <strong>Debug Info:</strong> App loading...
    </div>
    
    <div class="tab-buttons">
      <button class="tab-btn active" onclick="switchTab('landing')">Home</button>
      <button class="tab-btn" onclick="switchTab('journal')">Journal</button>
      <button class="tab-btn" onclick="switchTab('schedule')">Schedule</button>
      <button class="tab-btn" onclick="switchTab('finance')">Finance</button>
      <button class="tab-btn" onclick="switchTab('settings')">Settings</button>
    </div>
    
    <div id="landing-tab" class="tab-content active">
      <h2>Welcome!</h2>
      <p>Enter your name to get started:</p>
      <input type="text" id="username" placeholder="Your name" value="Test User">
      <button onclick="setUsername()">Start</button>
      
      <h3 style="margin-top: 30px;">Previous Users:</h3>
      <div id="previous-users"></div>
    </div>
    
    <div id="journal-tab" class="tab-content">
      <h2>Journal</h2>
      <textarea id="journal-text" placeholder="What's on your mind?" rows="4"></textarea>
      <button onclick="addJournal()">Add Entry</button>
      <div id="journal-list" style="margin-top: 20px;"></div>
    </div>
    
    <div id="schedule-tab" class="tab-content">
      <h2>Schedule</h2>
      <input type="text" id="event-title" placeholder="Event title">
      <input type="datetime-local" id="event-start">
      <input type="datetime-local" id="event-end">
      <button onclick="addEvent()">Add Event</button>
      <div id="schedule-list" style="margin-top: 20px;"></div>
    </div>
    
    <div id="finance-tab" class="tab-content">
      <h2>Finance</h2>
      <input type="number" id="amount" placeholder="Amount" step="0.01">
      <select id="finance-type">
        <option value="income">Income</option>
        <option value="expense">Expense</option>
      </select>
      <button onclick="addTransaction()">Add Transaction</button>
      <div id="finance-list" style="margin-top: 20px;"></div>
    </div>
    
    <div id="settings-tab" class="tab-content">
      <h2>Settings</h2>
      <p>Current user: <strong id="current-user-display">None</strong></p>
      <button onclick="logout()">Logout</button>
      <button onclick="clearData()">Clear All Data</button>
    </div>
  </div>

  <script>
    // Debug function
    function updateDebugInfo(message) {
      const debugEl = document.getElementById('debug-info');
      debugEl.innerHTML = '<strong>Debug Info:</strong> ' + message;
      console.log(message);
    }
    
    // Initialize
    document.addEventListener('DOMContentLoaded', function() {
      updateDebugInfo('DOM loaded, initializing...');
      
      // Check if user exists
      const username = localStorage.getItem('username');
      if (username) {
        updateDebugInfo('User found: ' + username);
        document.getElementById('current-user-display').textContent = username;
        switchTab('journal');
      } else {
        updateDebugInfo('No user found, showing landing page');
        switchTab('landing');
        loadPreviousUsers();
      }
    });
    
    // Tab switching
    function switchTab(tabName) {
      updateDebugInfo('Switching to tab: ' + tabName);
      
      // Hide all tabs
      document.querySelectorAll('.tab-content').forEach(tab => {
        tab.classList.remove('active');
      });
      
      // Deactivate all buttons
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      
      // Show selected tab
      const tabElement = document.getElementById(tabName + '-tab');
      if (tabElement) {
        tabElement.classList.add('active');
      }
      
      // Activate clicked button
      event.target.classList.add('active');
      
      // Load tab data
      if (tabName === 'journal') loadJournal();
      if (tabName === 'schedule') loadSchedule();
      if (tabName === 'finance') loadFinance();
    }
    
    // Username functions
    function setUsername() {
      const username = document.getElementById('username').value.trim();
      if (!username) {
        alert('Please enter a name');
        return;
      }
      
      localStorage.setItem('username', username);
      
      // Save to users list
      let users = JSON.parse(localStorage.getItem('users') || '[]');
      if (!users.includes(username)) {
        users.push(username);
        localStorage.setItem('users', JSON.stringify(users));
      }
      
      document.getElementById('current-user-display').textContent = username;
      updateDebugInfo('Username set to: ' + username);
      switchTab('journal');
    }
    
    function loadPreviousUsers() {
      const users = JSON.parse(localStorage.getItem('users') || '[]');
      const container = document.getElementById('previous-users');
      
      if (users.length === 0) {
        container.innerHTML = '<p>No previous users</p>';
        return;
      }
      
      let html = '';
      users.forEach(user => {
        html += `<button onclick="selectUser('${user}')" style="margin: 5px;">${user}</button>`;
      });
      container.innerHTML = html;
    }
    
    function selectUser(username) {
      document.getElementById('username').value = username;
    }
    
    // Journal functions
    function addJournal() {
      const text = document.getElementById('journal-text').value.trim();
      if (!text) {
        alert('Please enter text');
        return;
      }
      
      const entry = {
        id: Date.now(),
        text: text,
        date: new Date().toLocaleString(),
        user: localStorage.getItem('username')
      };
      
      // Save to localStorage
      let entries = JSON.parse(localStorage.getItem('journalEntries') || '[]');
      entries.push(entry);
      localStorage.setItem('journalEntries', JSON.stringify(entries));
      
      document.getElementById('journal-text').value = '';
      loadJournal();
      updateDebugInfo('Journal entry added');
    }
    
    function loadJournal() {
      const entries = JSON.parse(localStorage.getItem('journalEntries') || '[]');
      const container = document.getElementById('journal-list');
      
      if (entries.length === 0) {
        container.innerHTML = '<p>No journal entries yet</p>';
        return;
      }
      
      let html = '<h3>Your Entries:</h3>';
      entries.reverse().forEach(entry => {
        html += `
          <div style="border: 1px solid #ddd; padding: 10px; margin: 10px 0; border-radius: 5px;">
            <p><strong>${entry.user}</strong> - ${entry.date}</p>
            <p>${entry.text}</p>
          </div>
        `;
      });
      
      container.innerHTML = html;
    }
    
    // Schedule functions
    function addEvent() {
      const title = document.getElementById('event-title').value.trim();
      const start = document.getElementById('event-start').value;
      const end = document.getElementById('event-end').value;
      
      if (!title || !start || !end) {
        alert('Please fill all fields');
        return;
      }
      
      const event = {
        id: Date.now(),
        title: title,
        start: start,
        end: end,
        date: new Date().toLocaleString(),
        user: localStorage.getItem('username')
      };
      
      let events = JSON.parse(localStorage.getItem('events') || '[]');
      events.push(event);
      localStorage.setItem('events', JSON.stringify(events));
      
      document.getElementById('event-title').value = '';
      document.getElementById('event-start').value = '';
      document.getElementById('event-end').value = '';
      loadSchedule();
      updateDebugInfo('Event added');
    }
    
    function loadSchedule() {
      const events = JSON.parse(localStorage.getItem('events') || '[]');
      const container = document.getElementById('schedule-list');
      
      if (events.length === 0) {
        container.innerHTML = '<p>No events yet</p>';
        return;
      }
      
      let html = '<h3>Your Events:</h3>';
      events.reverse().forEach(event => {
        html += `
          <div style="border: 1px solid #ddd; padding: 10px; margin: 10px 0; border-radius: 5px;">
            <p><strong>${event.title}</strong></p>
            <p>Start: ${new Date(event.start).toLocaleString()}</p>
            <p>End: ${new Date(event.end).toLocaleString()}</p>
            <p><small>By: ${event.user} on ${event.date}</small></p>
          </div>
        `;
      });
      
      container.innerHTML = html;
    }
    
    // Finance functions
    function addTransaction() {
      const amount = parseFloat(document.getElementById('amount').value);
      const type = document.getElementById('finance-type').value;
      
      if (!amount || amount <= 0) {
        alert('Please enter a valid amount');
        return;
      }
      
      const transaction = {
        id: Date.now(),
        amount: amount,
        type: type,
        date: new Date().toLocaleString(),
        user: localStorage.getItem('username')
      };
      
      let transactions = JSON.parse(localStorage.getItem('transactions') || '[]');
      transactions.push(transaction);
      localStorage.setItem('transactions', JSON.stringify(transactions));
      
      document.getElementById('amount').value = '';
      loadFinance();
      updateDebugInfo('Transaction added');
    }
    
    function loadFinance() {
      const transactions = JSON.parse(localStorage.getItem('transactions') || '[]');
      const container = document.getElementById('finance-list');
      
      if (transactions.length === 0) {
        container.innerHTML = '<p>No transactions yet</p>';
        return;
      }
      
      // Calculate balance
      let balance = 0;
      transactions.forEach(t => {
        if (t.type === 'income') {
          balance += t.amount;
        } else {
          balance -= t.amount;
        }
      });
      
      let html = `<h3>Balance: $${balance.toFixed(2)}</h3>`;
      html += '<h4>Transactions:</h4>';
      
      transactions.reverse().forEach(t => {
        const color = t.type === 'income' ? 'green' : 'red';
        html += `
          <div style="border: 1px solid #ddd; padding: 10px; margin: 10px 0; border-radius: 5px;">
            <p style="color: ${color}; font-weight: bold;">
              ${t.type === 'income' ? '+' : '-'}$${t.amount.toFixed(2)} - ${t.type}
            </p>
            <p><small>By: ${t.user} on ${t.date}</small></p>
          </div>
        `;
      });
      
      container.innerHTML = html;
    }
    
    // Settings functions
    function logout() {
      if (confirm('Are you sure you want to logout?')) {
        localStorage.removeItem('username');
        updateDebugInfo('Logged out');
        location.reload();
      }
    }
    
    function clearData() {
      if (confirm('Are you sure you want to clear ALL data? This cannot be undone.')) {
        localStorage.clear();
        updateDebugInfo('All data cleared');
        location.reload();
      }
    }
  </script>
</body>
</html>
