<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Shared Life</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">

<style>
  body{
    margin:0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
    background:#f5f7fb;
  }

  nav{
    background:#1976D2;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 16px;
  }

  .nav-brand{font-size:20px;font-weight:600}

  .nav-tabs button{
    background:none;
    border:none;
    color:white;
    padding:10px 14px;
    cursor:pointer;
  }

  .nav-tabs button.active{
    border-bottom:3px solid white;
  }

  .page-container{
    max-width:1000px;
    margin:0 auto;
    padding:16px;
  }

  .tab-page{display:none}
  .tab-page.active{display:block}

  .form-card{
    background:white;
    padding:18px;
    border-radius:12px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
  }

  .user-chip{
    padding:6px 12px;
    border-radius:20px;
    background:#E3F2FD;
    border:none;
    color:#1976D2;
    cursor:pointer;
  }

  input,textarea,select{
    width:100%;
    padding:10px;
    border-radius:6px;
    border:1px solid #ccc;
  }

  button{
    cursor:pointer;
  }

  .item-card{
    background:white;
    padding:14px;
    margin-bottom:8px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
  }

  .balance-card{
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:white;
    padding:20px;
    border-radius:14px;
    margin-bottom:16px;
  }

  .calendar-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
  }

  .calendar-day{
    background:white;
    border-radius:10px;
    padding:8px;
    min-height:80px;
    box-shadow:0 1px 6px rgba(0,0,0,.05);
  }
</style>
</head>

<body>

<!-- NAV -->
<nav id="main-nav" style="display:none;">
  <div class="nav-brand">Shared Life</div>

  <div class="nav-tabs">
    <button onclick="navigateTo('home')" class="active">Home</button>
    <button onclick="navigateTo('journal')">Journal</button>
    <button onclick="navigateTo('schedule')">Schedule</button>
    <button onclick="navigateTo('finance')">Keuangan</button>
    <button onclick="navigateTo('calendar')">Calendar</button>
    <button onclick="navigateTo('settings')">Settings</button>
  </div>

  <div>
    <span id="nav-username"></span>
    <button onclick="logout()">Logout</button>
    <button onclick="syncNow()">Sync</button>
  </div>
</nav>


<div class="page-container">

<!-- LANDING -->
<div id="landing-page" class="tab-page active">

  <div class="form-card">
    <h2>Pilih / Tambah User</h2>

    <div id="user-select-list" style="margin-bottom:10px;"></div>

    <input id="username-input" placeholder="Nama user baru">

    <button onclick="loginUser()" style="margin-top:10px;">
      Tambah & Masuk
    </button>
  </div>
</div>


<!-- HOME -->
<div id="home-page" class="tab-page">

  <h2>Dashboard</h2>

  <div class="form-card">
    <div style="display:flex;gap:10px;">
      <div class="form-card" style="flex:1;text-align:center;">
        <h3>Journal</h3>
        <div id="journal-count" style="font-size:32px;">0</div>
      </div>

      <div class="form-card" style="flex:1;text-align:center;">
        <h3>Schedule</h3>
        <div id="schedule-count" style="font-size:32px;">0</div>
      </div>

      <div class="form-card" style="flex:1;text-align:center;">
        <h3>Keuangan</h3>
        <div id="finance-count" style="font-size:32px;">0</div>
      </div>
    </div>
  </div>

  <div class="form-card">
    <h3>Pencarian</h3>
    <input id="search-input" placeholder="contoh: apa yang fikri lakukan juni?">
    <button onclick="runSearch()" style="margin-top:8px;">Cari</button>
    <div id="search-results"></div>
  </div>

</div>


<!-- JOURNAL -->
<div id="journal-page" class="tab-page">
  <div class="form-card">
    <textarea id="journal-text" placeholder="Tulis jurnal..."></textarea>
    <label><input type="checkbox" id="journal-shared"> Shared</label>
    <button onclick="addJournalEntry()">Tambah</button>
  </div>

  <div id="journal-list"></div>
</div>


<!-- SCHEDULE -->
<div id="schedule-page" class="tab-page">

  <div class="form-card">
    <input id="schedule-title" placeholder="Judul">
    <input type="datetime-local" id="schedule-start">
    <input type="datetime-local" id="schedule-end">
    <label><input type="checkbox" id="schedule-shared"> Shared</label>
    <button onclick="addScheduleEntry()">Tambah</button>
  </div>

  <div id="schedule-list"></div>
</div>


<!-- FINANCE -->
<div id="finance-page" class="tab-page">

  <div id="balance-display"></div>

  <div class="form-card">
    <input id="finance-amount" type="number" placeholder="Nominal">
    <select id="finance-type">
      <option value="in">Income</option>
      <option value="out">Expense</option>
    </select>
    <label><input type="checkbox" id="finance-shared"> Shared</label>
    <button onclick="addFinanceEntry()">Tambah</button>
  </div>

  <div id="finance-list"></div>
</div>


<!-- CALENDAR -->
<div id="calendar-page" class="tab-page">

  <div class="form-card">
    <button onclick="renderCalendar('daily')">Daily</button>
    <button onclick="renderCalendar('weekly')">Weekly</button>
    <button onclick="renderCalendar('monthly')">Monthly</button>
  </div>

  <div id="calendar-root"></div>
</div>


<!-- SETTINGS -->
<div id="settings-page" class="tab-page">

  <div class="form-card">
    <h3>Registered Users</h3>
    <div id="settings-user-list"></div>
  </div>

  <div class="form-card">
    <button onclick="clearAllData()" style="background:#f44336;color:white;">
      Hapus Semua Data Lokal
    </button>
  </div>

</div>

</div>


<!-- ========== MODULE SCRIPT ========== -->
<script type="module">

import { openDB } from "./js/db.js";
import { getUser, setUser } from "./js/users.js";
import { search } from "./js/search.js";
import { renderCalendar } from "./js/calendar.js";


// ======== NAV ========

window.navigateTo = function(page){

  document.querySelectorAll(".nav-tabs button")
    .forEach(btn=>btn.classList.remove("active"));

  event.target.classList.add("active");

  document.querySelectorAll(".tab-page")
    .forEach(p=>p.classList.remove("active"));

  document.getElementById(page+"-page").classList.add("active");
};


// ======== LOGIN ========

window.loginUser = ()=>{}; // akan dioverride oleh app.js
window.quickLogin = ()=>{};
window.logout = ()=>{};


// ======== SEARCH ========

window.runSearch = async ()=>{

  const q = document.getElementById("search-input").value;
  const res = await search(q);

  document.getElementById("search-results").innerHTML =
    res.map(r=>`
      <div class="item-card">
        <b>${r.type}</b><br>
        ${r.title || r.text || r.amount}
      </div>
    `).join("");
};


// ======== ADMIN ========

window.clearAllData = async ()=>{

  if(!confirm("Hapus semua data lokal?")) return;

  const db = await openDB();

  for(const s of db.objectStoreNames){
    db.transaction(s,"readwrite").objectStore(s).clear();
  }

  alert("Done");
  location.reload();
};


// ======== INIT ========

window.addEventListener("load", async()=>{
  await openDB();
});

</script>

<script type="module" src="js/app.js"></script>

</body>
</html>
