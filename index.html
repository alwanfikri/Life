<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shared Life Beta</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <style>
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      border-bottom: 2px solid #e0e0e0;
    }
    .tab {
      padding: 12px 24px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      border-bottom: 3px solid transparent;
      transition: all 0.3s;
    }
    .tab:hover {
      background: #f5f5f5;
    }
    .tab.active {
      border-bottom-color: #2196F3;
      color: #2196F3;
      font-weight: 600;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
    }
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
    }
    .form-group textarea {
      min-height: 100px;
      resize: vertical;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
    }
    .btn-primary {
      background: #2196F3;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      width: 100%;
    }
    .btn-primary:hover {
      background: #1976D2;
    }
    .items-list {
      margin-top: 24px;
    }
    .item-card {
      background: #f9f9f9;
      padding: 16px;
      margin-bottom: 12px;
      border-radius: 8px;
      border-left: 4px solid #2196F3;
    }
    .item-card.shared {
      background: #e8f5e9;
      border-left-color: #4CAF50;
    }
    .item-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .item-badge {
      display: inline-block;
      padding: 4px 8px;
      background: #2196F3;
      color: white;
      border-radius: 4px;
      font-size: 12px;
    }
    .item-badge.shared {
      background: #4CAF50;
    }
    .item-meta {
      color: #666;
      font-size: 13px;
    }
    .amount {
      font-size: 24px;
      font-weight: bold;
      margin: 8px 0;
    }
    .amount.income {
      color: #4CAF50;
    }
    .amount.expense {
      color: #f44336;
    }
  </style>
</head>
<body>

<div id="user-select">
  <h2>Who are you?</h2>
  <button onclick="selectUser('fikri')">Fikri</button>
  <button onclick="selectUser('khansa')">Khansa</button>
</div>

<div id="app" hidden>
  <header>
    <span id="activeUser"></span>
    <button onclick="syncNow()">Sync</button>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('journal')">Journal</button>
    <button class="tab" onclick="switchTab('schedule')">Schedule</button>
    <button class="tab" onclick="switchTab('finance')">Finance</button>
  </div>

  <!-- Journal Tab -->
  <div id="journal-tab" class="tab-content active">
    <div class="form-group">
      <label>Write your thoughts</label>
      <textarea id="journal-text" placeholder="What's on your mind?"></textarea>
    </div>
    <div class="checkbox-group">
      <input type="checkbox" id="journal-shared">
      <label for="journal-shared">Share with partner</label>
    </div>
    <button class="btn-primary" onclick="addJournalEntry()">Add Entry</button>
    <div id="journal-list" class="items-list"></div>
  </div>

  <!-- Schedule Tab -->
  <div id="schedule-tab" class="tab-content">
    <div class="form-group">
      <label>Event Title</label>
      <input type="text" id="schedule-title" placeholder="e.g., Date night">
    </div>
    <div class="form-group">
      <label>Start Time</label>
      <input type="datetime-local" id="schedule-start">
    </div>
    <div class="form-group">
      <label>End Time</label>
      <input type="datetime-local" id="schedule-end">
    </div>
    <div class="checkbox-group">
      <input type="checkbox" id="schedule-shared">
      <label for="schedule-shared">Share with partner</label>
    </div>
    <button class="btn-primary" onclick="addScheduleEntry()">Add Event</button>
    <div id="schedule-list" class="items-list"></div>
  </div>

  <!-- Finance Tab -->
  <div id="finance-tab" class="tab-content">
    <div class="form-group">
      <label>Amount</label>
      <input type="number" id="finance-amount" placeholder="0.00" step="0.01">
    </div>
    <div class="form-group">
      <label>Type</label>
      <select id="finance-type" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px;">
        <option value="in">Income</option>
        <option value="out">Expense</option>
      </select>
    </div>
    <div class="checkbox-group">
      <input type="checkbox" id="finance-shared">
      <label for="finance-shared">Share with partner</label>
    </div>
    <button class="btn-primary" onclick="addFinanceEntry()">Add Transaction</button>
    <div id="finance-list" class="items-list"></div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
<script type="module">
  import { addJournal } from './js/journal.js';
  import { addSchedule } from './js/schedule.js';
  import { addFinance } from './js/finance.js';
  import { openDB } from './js/db.js';

  // Make functions global
  window.switchTab = function(tabName) {
    // Update tab buttons
    document.querySelectorAll('.tab').forEach(tab => {
      tab.classList.remove('active');
    });
    event.target.classList.add('active');

    // Update tab content
    document.querySelectorAll('.tab-content').forEach(content => {
      content.classList.remove('active');
    });
    document.getElementById(tabName + '-tab').classList.add('active');

    // Load data for this tab
    loadTabData(tabName);
  };

  window.addJournalEntry = async function() {
    const text = document.getElementById('journal-text').value.trim();
    const shared = document.getElementById('journal-shared').checked;

    if (!text) {
      alert('Please write something!');
      return;
    }

    await addJournal(text, shared);
    document.getElementById('journal-text').value = '';
    document.getElementById('journal-shared').checked = false;
    loadTabData('journal');
  };

  window.addScheduleEntry = async function() {
    const title = document.getElementById('schedule-title').value.trim();
    const start = document.getElementById('schedule-start').value;
    const end = document.getElementById('schedule-end').value;
    const shared = document.getElementById('schedule-shared').checked;

    if (!title || !start || !end) {
      alert('Please fill all fields!');
      return;
    }

    await addSchedule(title, start, end, shared);
    document.getElementById('schedule-title').value = '';
    document.getElementById('schedule-start').value = '';
    document.getElementById('schedule-end').value = '';
    document.getElementById('schedule-shared').checked = false;
    loadTabData('schedule');
  };

  window.addFinanceEntry = async function() {
    const amount = parseFloat(document.getElementById('finance-amount').value);
    const type = document.getElementById('finance-type').value;
    const shared = document.getElementById('finance-shared').checked;

    if (!amount || amount <= 0) {
      alert('Please enter a valid amount!');
      return;
    }

    await addFinance(amount, type, shared);
    document.getElementById('finance-amount').value = '';
    document.getElementById('finance-shared').checked = false;
    loadTabData('finance');
  };

  async function loadTabData(tabName) {
    const db = await openDB();
    const storeName = tabName === 'journal' ? 'journals' : tabName === 'schedule' ? 'schedules' : 'finance';
    
    const tx = db.transaction(storeName, 'readonly');
    const store = tx.objectStore(storeName);
    const items = await new Promise((resolve, reject) => {
      const request = store.getAll();
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });

    const listId = tabName + '-list';
    const listEl = document.getElementById(listId);

    if (items.length === 0) {
      listEl.innerHTML = '<p style="text-align: center; color: #999; padding: 40px;">No items yet</p>';
      return;
    }

    if (tabName === 'journal') {
      listEl.innerHTML = items.sort((a, b) => b.createdAt - a.createdAt).map(item => `
        <div class="item-card ${item.shared ? 'shared' : ''}">
          <div class="item-header">
            <span class="item-badge ${item.shared ? 'shared' : ''}">${item.owner}</span>
            <span class="item-meta">${new Date(item.createdAt).toLocaleDateString()}</span>
          </div>
          <p style="margin: 8px 0 0 0;">${item.text}</p>
        </div>
      `).join('');
    } else if (tabName === 'schedule') {
      listEl.innerHTML = items.sort((a, b) => new Date(a.start) - new Date(b.start)).map(item => `
        <div class="item-card ${item.shared ? 'shared' : ''}">
          <div class="item-header">
            <span class="item-badge ${item.shared ? 'shared' : ''}">${item.owner}</span>
          </div>
          <h4 style="margin: 8px 0;">${item.title}</h4>
          <p class="item-meta">
            ${new Date(item.start).toLocaleString()} - ${new Date(item.end).toLocaleString()}
          </p>
        </div>
      `).join('');
    } else if (tabName === 'finance') {
      const total = items.reduce((sum, item) => sum + (item.type === 'in' ? item.amount : -item.amount), 0);
      listEl.innerHTML = `
        <div class="item-card" style="border-left-color: #9C27B0; background: #f3e5f5;">
          <h4 style="margin: 0 0 8px 0;">Balance</h4>
          <div class="amount ${total >= 0 ? 'income' : 'expense'}">
            ${total >= 0 ? '+' : ''}$${total.toFixed(2)}
          </div>
        </div>
      ` + items.sort((a, b) => b.createdAt - a.createdAt).map(item => `
        <div class="item-card ${item.shared ? 'shared' : ''}">
          <div class="item-header">
            <span class="item-badge ${item.shared ? 'shared' : ''}">${item.owner}</span>
            <span class="item-meta">${new Date(item.createdAt).toLocaleDateString()}</span>
          </div>
          <div class="amount ${item.type === 'in' ? 'income' : 'expense'}">
            ${item.type === 'in' ? '+' : '-'}$${item.amount.toFixed(2)}
          </div>
        </div>
      `).join('');
    }
  }

  // Load initial data when app loads
  window.addEventListener('load', () => {
    const user = localStorage.getItem('activeUser');
    if (user) {
      setTimeout(() => loadTabData('journal'), 500);
    }
  });
</script>

</body>
</html>
