<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Shared Life</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
</head>

<body>

<nav id="main-nav" style="display:none;">
  <div class="nav-brand">Shared Life</div>

  <div class="nav-tabs">
    <button class="nav-tab active" data-page="home">Home</button>
    <button class="nav-tab" data-page="journal">Journal</button>
    <button class="nav-tab" data-page="schedule">Schedule</button>
    <button class="nav-tab" data-page="finance">Finance</button>
    <button class="nav-tab" data-page="settings">Settings</button>
  </div>

  <div class="nav-user">
    <span id="nav-username"></span>
    <button onclick="logout()">Logout</button>
    <button onclick="syncNow(event)">Sync</button>
  </div>
</nav>


<div class="page-container">

  <!-- LANDING -->
  <div id="landing-page" class="tab-page active">
    <div class="form-card">
      <h2>Selamat datang 👋</h2>

      <p>Pilih user</p>

      <div id="user-select-list"></div>

      <hr>

      <p>Atau buat user baru</p>

      <input id="username-input" placeholder="misal: fikri">

      <br><br>

      <button class="btn-primary" onclick="loginUser()">Tambah & Masuk</button>
    </div>
  </div>


  <!-- HOME -->
  <div id="home-page" class="tab-page">
    <h2>Dashboard</h2>

    <div class="dashboard-grid" style="margin-top:12px;">
      <div class="form-card">
        <h3>Journal</h3>
        <div id="journal-count" style="font-size:36px;">0</div>
      </div>

      <div class="form-card">
        <h3>Schedule</h3>
        <div id="schedule-count" style="font-size:36px;">0</div>
      </div>

      <div class="form-card">
        <h3>Transaksi</h3>
        <div id="finance-count" style="font-size:36px;">0</div>
      </div>
    </div>

    <div class="form-card">
      <h3>Ringkasan Hari Ini</h3>

      <p id="today-journal"></p>
      <p id="today-schedule"></p>
      <p id="today-income"></p>
      <p id="today-expense"></p>
    </div>
  </div>


  <!-- JOURNAL -->
  <div id="journal-page" class="tab-page">

    <div class="form-card">
      <h3>Journal Baru</h3>

      <textarea id="journal-text" placeholder="Tulis pikiranmu…"></textarea>

      <br>

      <label>
        <input type="checkbox" id="journal-shared">
        Shared
      </label>

      <br><br>

      <button class="btn-primary" onclick="addJournalEntry()">Simpan</button>
    </div>

    <div id="journal-list"></div>
  </div>


  <!-- SCHEDULE -->
  <div id="schedule-page" class="tab-page">

    <div class="form-card">
      <h3>Jadwal Baru</h3>

      <input id="schedule-title" placeholder="Judul">
      <br><br>

      <input id="schedule-category" placeholder="Kategori (opsional)">
      <br><br>

      <label>Mulai</label>
      <input id="schedule-start" type="datetime-local">
      <br><br>

      <label>Selesai</label>
      <input id="schedule-end" type="datetime-local">
      <br><br>

      <label>
        <input type="checkbox" id="schedule-shared">
        Shared
      </label>

      <br><br>

      <button class="btn-primary" onclick="addScheduleEntry()">Simpan</button>
    </div>

    <div id="schedule-list"></div>
  </div>


  <!-- FINANCE -->
  <div id="finance-page" class="tab-page">

    <div id="balance-display"></div>

    <div class="form-card">
      <h3>Transaksi Baru</h3>

      <input id="finance-amount" type="number" placeholder="Jumlah">
      <br><br>

      <select id="finance-type">
        <option value="in">Pemasukan</option>
        <option value="out">Pengeluaran</option>
      </select>
      <br><br>

      <input id="finance-category" placeholder="Kategori (opsional)">
      <br><br>

      <label>
        <input type="checkbox" id="finance-shared">
        Shared
      </label>

      <br><br>

      <button class="btn-primary" onclick="addFinanceEntry()">Simpan</button>
    </div>

    <div id="finance-list"></div>
  </div>


  <!-- SETTINGS -->
  <div id="settings-page" class="tab-page">

    <div class="form-card">
      <h3>Tambah User</h3>

      <input id="new-user-input" placeholder="Nama user baru">
      <br><br>

      <button class="btn-primary" onclick="addUser()">Tambah</button>
    </div>

    <div class="form-card">
      <h3>User Terdaftar</h3>
      <div id="user-list"></div>
    </div>

    <div class="form-card">
      <h3>Ganti Nama User Aktif</h3>

      <input id="rename-input" placeholder="Nama baru">
      <br><br>

      <button class="btn-primary" onclick="renameUser()">Ganti</button>
    </div>

    <div class="form-card">
      <h3>Reset Semua Data</h3>

      <button class="btn-primary" style="background:#d32f2f"
        onclick="resetAllData()">
        Hapus Semua Data
      </button>
    </div>

  </div>

</div>


<script type="module" src="js/app.js"></script>


<script type="module">
import { addJournal } from "./js/journal.js";
import { addSchedule } from "./js/schedule.js";
import { addFinance } from "./js/finance.js";
import { openDB } from "./js/db.js";
import { setUser, getUser } from "./js/users.js";


/* ========= USER LIST UI ========= */

function loadLandingUsers(){
  const box=document.getElementById("user-select-list");
  const users=JSON.parse(localStorage.getItem("recentUsers")||"[]");

  if(users.length===0){
    box.innerHTML="<i>Belum ada user</i>";
    return;
  }

  box.innerHTML = users.map(u=>`
    <button class="user-chip" onclick="quickLogin('${u}')">${u}</button>
  `).join("");
}

window.quickLogin = u =>{
  setUser(u);
  showApp(u);
};

window.addUser = ()=>{
  const name=document.getElementById("new-user-input").value.trim();
  if(!name) return;

  let users=JSON.parse(localStorage.getItem("recentUsers")||"[]");
  users=[name,...users.filter(x=>x!==name)];
  localStorage.setItem("recentUsers",JSON.stringify(users));

  alert("User ditambahkan");
  loadUserList();
  loadLandingUsers();
};


/* ========= EXISTING LOGIN ========= */

window.loginUser = ()=>{
  const u=document.getElementById("username-input").value.trim();
  if(!u) return;

  let users=JSON.parse(localStorage.getItem("recentUsers")||"[]");
  users=[u,...users.filter(x=>x!==u)];
  localStorage.setItem("recentUsers",JSON.stringify(users));

  setUser(u);
  showApp(u);
};


/* ========= SETTINGS USER LIST ========= */

window.loadUserList = ()=>{
  const users=JSON.parse(localStorage.getItem("recentUsers")||"[]");
  const box=document.getElementById("user-list");

  box.innerHTML = users.map(u=>`
    <div class="item-card">${u}</div>
  `).join("");
};


/* ========= RENAME ========= */

window.renameUser = ()=>{
  const newName=document.getElementById("rename-input").value.trim();
  if(!newName) return;

  const old=getUser();

  localStorage.setItem("activeUser",newName);

  let users=JSON.parse(localStorage.getItem("recentUsers")||"[]");
  users=[newName,...users.filter(x=>x!==old)];
  localStorage.setItem("recentUsers",JSON.stringify(users));

  alert("Nama diganti");
  location.reload();
};


/* ========= RESET ========= */

window.resetAllData = ()=>{
  if(!confirm("Hapus semua data?")) return;

  indexedDB.deleteDatabase("life_beta");
  localStorage.clear();
  location.reload();
};


/* ========= NAVIGATION ========= */

document.querySelectorAll(".nav-tab").forEach(t=>{
  t.addEventListener("click",()=>navigateTo(t.dataset.page));
});

window.navigateTo = page =>{
  document.querySelectorAll(".nav-tab")
    .forEach(t=>t.classList.toggle("active",t.dataset.page===page));

  document.querySelectorAll(".tab-page")
    .forEach(p=>p.classList.remove("active"));

  document.getElementById(page+"-page").classList.add("active");

  if(page==="settings") loadUserList();
};


/* ========= SHOW APP ========= */

function showApp(username){
  document.getElementById("landing-page").classList.remove("active");
  document.getElementById("home-page").classList.add("active");
  document.getElementById("main-nav").style.display="flex";
  document.getElementById("nav-username").textContent=username;
}


/* ========= INIT ========= */

window.addEventListener("load", async()=>{
  await openDB();
  loadLandingUsers();

  const u=getUser();
  if(u) showApp(u);
});
</script>

</body>
</html>
