<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shared Life - Simple Version</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    
    h1 {
      color: #333;
      text-align: center;
      margin-bottom: 30px;
    }
    
    .tab-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
    }
    
    .tab-btn {
      padding: 10px 20px;
      border: none;
      background: #f0f0f0;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    
    .tab-btn.active {
      background: #4CAF50;
      color: white;
    }
    
    .tab-content {
      display: none;
      padding: 20px;
      border: 1px solid #eee;
      border-radius: 5px;
      background: #fafafa;
    }
    
    .tab-content.active {
      display: block;
    }
    
    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 16px;
    }
    
    button {
      padding: 10px 20px;
      background: #2196F3;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    
    button:hover {
      background: #1976D2;
    }
    
    .debug-info {
      margin-top: 30px;
      padding: 15px;
      background: #fff3cd;
      border: 1px solid #ffeaa7;
      border-radius: 5px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container" id="app">
    <h1>Shared Life - Simple Version</h1>
    
    <div class="debug-info" id="debug-info">
      <strong>Debug Info:</strong> App loading...
    </div>
    
    <div class="tab-buttons">
      <button class="tab-btn active" onclick="switchTab('landing')">Home</button>
      <button class="tab-btn" onclick="switchTab('journal')">Journal</button>
      <button class="tab-btn" onclick="switchTab('schedule')">Schedule</button>
      <button class="tab-btn" onclick="switchTab('finance')">Finance</button>
      <button class="tab-btn" onclick="switchTab('settings')">Settings</button>
    </div>
    
    <div id="landing-tab" class="tab-content active">
      <h2>Welcome!</h2>
      <p>Enter your name to get started:</p>
      <input type="text" id="username" placeholder="Your name" value="Test User">
      <button onclick="setUsername()">Start</button>
      
      <h3 style="margin-top: 30px;">Previous Users:</h3>
      <div id="previous-users"></div>
    </div>
    
    <div id="journal-tab" class="tab-content">
      <h2>Journal</h2>
      <textarea id="journal-text" placeholder="What's on your mind?" rows="4"></textarea>
      <button onclick="addJournal()">Add Entry</button>
      <div id="journal-list" style="margin-top: 20px;"></div>
    </div>
    
    <div id="schedule-tab" class="tab-content">
      <h2>Schedule</h2>
      <input type="text" id="event-title" placeholder="Event title">
      <input type="datetime-local" id="event-start">
      <input type="datetime-local" id="event-end">
      <button onclick="addEvent()">Add Event</button>
      <div id="schedule-list" style="margin-top: 20px;"></div>
    </div>
    
    <div id="finance-tab" class="tab-content">
      <h2>Finance</h2>
      <input type="number" id="amount" placeholder="Amount" step="0.01">
      <select id="finance-type">
        <option value="income">Income</option>
        <option value="expense">Expense</option>
      </select>
      <button onclick="addTransaction()">Add Transaction</button>
      <div id="finance-list" style="margin-top: 20px;"></div>
    </div>
    
    <div id="settings-tab" class="tab-content">
      <h2>Settings</h2>
      <p>Current user: <strong id="current-user-display">None</strong></p>
      <button onclick="logout()">Logout</button>
      <button onclick="clearData()">Clear All Data</button>
    </div>
  </div>
<!-- Remove module imports and use simple scripts -->
<script src="js/users.js"></script>
<script src="js/db.js"></script>
<script src="js/journal.js"></script>
<script src="js/schedule.js"></script>
<script src="js/finance.js"></script>

<script>
  // Simple initialization
  console.log('Shared Life starting...');
  
  document.addEventListener('DOMContentLoaded', function() {
    console.log('DOM loaded');
    
    // Show landing page initially
    document.getElementById('landing').style.display = 'block';
    document.getElementById('app').style.display = 'none';
    
    // Check for existing user
    const user = localStorage.getItem('activeUser');
    if (user) {
      console.log('Found existing user:', user);
      startApp(user);
    }
  });
  
  window.startApp = function() {
    const username = document.getElementById('username').value.trim();
    if (!username) {
      alert('Please enter your name');
      return;
    }
    
    localStorage.setItem('activeUser', username);
    console.log('User set:', username);
    
    document.getElementById('landing').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('current-user').textContent = username;
  };
  
  window.selectExistingUser = function(username) {
    document.getElementById('username').value = username;
  };
  
  window.switchTab = function(tabName) {
    console.log('Switching to tab:', tabName);
    
    // Hide all tabs
    document.querySelectorAll('.tab-content').forEach(tab => {
      tab.style.display = 'none';
    });
    
    // Show selected tab
    const tab = document.getElementById(tabName + '-tab');
    if (tab) {
      tab.style.display = 'block';
    }
    
    // Update active button
    document.querySelectorAll('.nav-tab').forEach(btn => {
      btn.classList.remove('active');
    });
    
    if (event.target) {
      event.target.classList.add('active');
    }
  };
</script>  
</body>
</html>
