<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Shared Life</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">

  <style>
    *{box-sizing:border-box}
    body{margin:0;padding:0}

    nav{background:#1976D2;color:white;padding:0;display:flex;align-items:center;box-shadow:0 2px 4px rgba(0,0,0,.1)}
    .nav-brand{padding:16px 24px;font-size:20px;font-weight:600}
    .nav-tabs{display:flex;flex:1}
    .nav-tab{padding:16px 24px;background:none;border:none;color:white;cursor:pointer;font-size:16px;border-bottom:3px solid transparent;transition:.3s}
    .nav-tab.active{background:rgba(255,255,255,.2);border-bottom-color:#fff}
    .nav-user{padding:16px 24px;display:flex;gap:12px;align-items:center}

    .page-container{max-width:1100px;margin:0 auto;padding:24px}

    .tab-page{display:none}
    .tab-page.active{display:block}

    .form-card{background:white;padding:24px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1);margin-bottom:24px}

    .btn-primary{background:#1976D2;color:white;padding:12px;border-radius:6px;border:none;width:100%}

    .item-card{background:white;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1);margin-bottom:12px;border-left:4px solid #1976D2}
    .item-card.shared{background:#E8F5E9;border-left-color:#4CAF50}

    .item-badge{padding:4px 10px;border-radius:12px;background:#1976D2;color:white;font-size:12px}
    .item-badge.shared{background:#4CAF50}

    .amount{font-size:22px;font-weight:bold}
    .income{color:#4CAF50}
    .expense{color:#f44336}

    .balance-card{background:linear-gradient(135deg,#667eea,#764ba2);color:white;padding:20px;border-radius:12px;margin-bottom:16px}
  </style>
</head>

<body>

<nav id="main-nav" style="display:none;">
  <div class="nav-brand">Shared Life</div>

  <div class="nav-tabs">
    <button class="nav-tab active" data-page="home">Home</button>
    <button class="nav-tab" data-page="journal">Journal</button>
    <button class="nav-tab" data-page="schedule">Schedule</button>
    <button class="nav-tab" data-page="finance">Finance</button>
  </div>

  <div class="nav-user">
    <span id="nav-username"></span>
    <button onclick="logout()">Logout</button>
    <button onclick="syncNow(event)">Sync</button>
  </div>
</nav>


<div class="page-container">

  <!-- LANDING -->
  <div id="landing-page" class="tab-page active">
    <div class="form-card">
      <h2>Selamat datang 👋</h2>
      <p>Masukkan nama kamu</p>
      <input id="username-input" placeholder="misal: fikri">
      <button class="btn-primary" onclick="loginUser()">Masuk</button>

      <div id="recent-users" style="margin-top:16px;display:none;">
        <h4>Pengguna terakhir:</h4>
        <div id="user-chips"></div>
      </div>
    </div>
  </div>


  <!-- HOME -->
  <div id="home-page" class="tab-page">
    <h2>Dashboard</h2>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;">
      <div class="form-card">
        <h3>Journal</h3>
        <div id="journal-count" style="font-size:40px;">0</div>
      </div>
      <div class="form-card">
        <h3>Schedule</h3>
        <div id="schedule-count" style="font-size:40px;">0</div>
      </div>
      <div class="form-card">
        <h3>Transaksi</h3>
        <div id="finance-count" style="font-size:40px;">0</div>
      </div>
    </div>
  </div>


  <!-- JOURNAL -->
  <div id="journal-page" class="tab-page">

    <div class="form-card">
      <h3>Journal Baru</h3>
      <textarea id="journal-text"></textarea>

      <label><input type="checkbox" id="journal-shared"> Shared</label>

      <button class="btn-primary" onclick="addJournalEntry()">Simpan</button>
    </div>

    <div id="journal-list"></div>
  </div>


  <!-- SCHEDULE -->
  <div id="schedule-page" class="tab-page">

    <div class="form-card">
      <h3>Jadwal Baru</h3>
      <input id="schedule-title" placeholder="judul"><br><br>
      <input id="schedule-category" placeholder="kategori"><br><br>
      <input id="schedule-start" type="datetime-local"><br><br>
      <input id="schedule-end" type="datetime-local"><br><br>
      <label><input type="checkbox" id="schedule-shared"> Shared</label>

      <button class="btn-primary" onclick="addScheduleEntry()">Simpan</button>
    </div>

    <div id="schedule-list"></div>
  </div>


  <!-- FINANCE -->
  <div id="finance-page" class="tab-page">

    <div id="balance-display"></div>

    <div class="form-card">
      <h3>Transaksi Baru</h3>

      <input id="finance-amount" type="number" placeholder="jumlah"><br><br>

      <select id="finance-type">
        <option value="in">Pemasukan</option>
        <option value="out">Pengeluaran</option>
      </select><br><br>

      <input id="finance-category" placeholder="kategori"><br><br>

      <label><input type="checkbox" id="finance-shared"> Shared</label>

      <button class="btn-primary" onclick="addFinanceEntry()">Simpan</button>
    </div>

    <div class="form-card">
      <h3>Filter</h3>

      <input id="finance-filter-category" placeholder="kategori"><br><br>

      <select id="finance-filter-user">
        <option value="">Semua</option>
      </select><br><br>

      <select id="finance-filter-shared">
        <option value="">Semua</option>
        <option value="true">Shared</option>
        <option value="false">Pribadi</option>
      </select><br><br>

      <button class="btn-primary" onclick="loadFinanceData()">Terapkan</button>
    </div>

    <div id="finance-list"></div>
  </div>

</div>


<script type="module" src="js/app.js"></script>


<script type="module">
import { addJournal } from './js/journal.js';
import { addSchedule } from './js/schedule.js';
import { addFinance } from './js/finance.js';
import { openDB } from './js/db.js';
import { setUser, getUser } from './js/users.js';


// ========= HELPERS =========
function formatRupiah(num){
  return new Intl.NumberFormat('id-ID',{
    style:'currency',
    currency:'IDR',
    minimumFractionDigits:0
  }).format(num);
}

function formatDateTime(d){
  return new Date(d).toLocaleString('id-ID',{
    weekday:'long',
    year:'numeric',
    month:'long',
    day:'numeric',
    hour:'2-digit',
    minute:'2-digit'
  });
}

function formatDate(d){
  return new Date(d).toLocaleDateString('id-ID',{
    weekday:'long',
    year:'numeric',
    month:'long',
    day:'numeric'
  });
}


// ========= NAVIGATION =========
document.querySelectorAll('.nav-tab').forEach(tab=>{
  tab.addEventListener('click',()=>navigateTo(tab.dataset.page));
});

window.navigateTo = page =>{
  document.querySelectorAll('.nav-tab')
    .forEach(t=>t.classList.toggle('active',t.dataset.page===page));

  document.querySelectorAll('.tab-page')
    .forEach(p=>p.classList.remove('active'));

  document.getElementById(page+'-page').classList.add('active');

  if(page==='home') loadDashboard();
  if(page==='journal') loadJournalData();
  if(page==='schedule') loadScheduleData();
  if(page==='finance') loadFinanceData();
};


// ========= USERS =========
function populateUserFilters(){
  const users = JSON.parse(localStorage.getItem('recentUsers')||'[]');
  const select = document.getElementById('finance-filter-user');
  select.innerHTML=`<option value="">Semua</option>`;
  users.forEach(u=>{
    const opt=document.createElement('option');
    opt.value=u;
    opt.textContent=u;
    select.appendChild(opt);
  });
}

window.loginUser = ()=>{
  const u=document.getElementById('username-input').value.trim();
  if(!u) return;
  setUser(u);

  let r=JSON.parse(localStorage.getItem('recentUsers')||'[]');
  r=[u,...r.filter(x=>x!==u)].slice(0,5);
  localStorage.setItem('recentUsers',JSON.stringify(r));

  showApp(u);
};

window.logout = ()=>{
  document.getElementById('main-nav').style.display='none';
  navigateTo('landing');
};

function showApp(username){
  document.getElementById('landing-page').classList.remove('active');
  document.getElementById('home-page').classList.add('active');
  document.getElementById('main-nav').style.display='flex';
  document.getElementById('nav-username').textContent=username;

  populateUserFilters();
  loadDashboard();
}


// ========= DB HELPER =========
async function getAll(db,store){
  return new Promise((res,rej)=>{
    const tx=db.transaction(store,'readonly');
    const req=tx.objectStore(store).getAll();
    req.onsuccess=()=>res(req.result);
    req.onerror=()=>rej(req.error);
  });
}


// ========= DASHBOARD =========
window.loadDashboard = async ()=>{
  const db=await openDB();
  document.getElementById('journal-count').textContent=(await getAll(db,'journals')).length;
  document.getElementById('schedule-count').textContent=(await getAll(db,'schedules')).length;
  document.getElementById('finance-count').textContent=(await getAll(db,'finance')).length;
};


// ========= JOURNAL =========
window.addJournalEntry = async ()=>{
  const text=document.getElementById('journal-text').value.trim();
  const shared=document.getElementById('journal-shared').checked;
  if(!text) return;
  await addJournal(text,shared);
  document.getElementById('journal-text').value='';
  loadJournalData();
};

window.loadJournalData = async ()=>{
  const db=await openDB();
  const list=document.getElementById('journal-list');
  const items=await getAll(db,'journals');

  list.innerHTML = items.sort((a,b)=>b.createdAt-a.createdAt).map(i=>`
    <div class="item-card ${i.shared?'shared':''}">
      <div class="item-header">
        <span class="item-badge">${i.owner}</span>
        ${i.shared?'<span class="item-badge shared">Shared</span>':''}
      </div>
      <p>${i.text}</p>
      <div class="item-meta">${formatDateTime(i.createdAt)}</div>
    </div>
  `).join('');
};


// ========= SCHEDULE =========
window.addScheduleEntry = async ()=>{
  await addSchedule(
    document.getElementById('schedule-title').value,
    document.getElementById('schedule-start').value,
    document.getElementById('schedule-end').value,
    document.getElementById('schedule-category').value,
    document.getElementById('schedule-shared').checked
  );
  loadScheduleData();
};

window.loadScheduleData = async ()=>{
  const db=await openDB();
  const list=document.getElementById('schedule-list');
  const items=await getAll(db,'schedules');

  list.innerHTML = items.map(i=>`
    <div class="item-card ${i.shared?'shared':''}">
      <div class="item-badges">
        <span class="item-badge">${i.owner}</span>
        ${i.category?`<span class="item-badge">${i.category}</span>`:''}
      </div>
      <h4>${i.title}</h4>
      <div class="item-meta">
        ${formatDateTime(i.start)} – ${formatDateTime(i.end)}
      </div>
    </div>
  `).join('');
};


// ========= FINANCE =========
window.addFinanceEntry = async ()=>{
  await addFinance(
    parseFloat(document.getElementById('finance-amount').value),
    document.getElementById('finance-type').value,
    document.getElementById('finance-category').value,
    document.getElementById('finance-shared').checked
  );
  loadFinanceData();
};

window.loadFinanceData = async ()=>{
  const db=await openDB();
  const items=await getAll(db,'finance');
  const list=document.getElementById('finance-list');
  const balance=document.getElementById('balance-display');
  const user=getUser();

  const sharedTotal = items.reduce((s,i)=>s+(i.shared?(i.type==='in'?i.amount:-i.amount):0),0);
  const myPrivate = items.reduce((s,i)=>s+(!i.shared&&i.owner===user?(i.type==='in'?i.amount:-i.amount):0),0);

  balance.innerHTML=`
    <div class="balance-card">
      <div>Saldo Shared: <b>${formatRupiah(sharedTotal)}</b></div>
      <div>Saldo Kamu: <b>${formatRupiah(myPrivate)}</b></div>
      <div>Total Kamu: <b>${formatRupiah(sharedTotal+myPrivate)}</b></div>
    </div>
  `;

  list.innerHTML = items.sort((a,b)=>b.createdAt-a.createdAt).map(i=>`
    <div class="item-card ${i.shared?'shared':''}">
      <div class="item-badges">
        <span class="item-badge">${i.owner}</span>
        ${i.category?`<span class="item-badge">${i.category}</span>`:''}
      </div>
      <div class="amount ${i.type==='in'?'income':'expense'}">
        ${i.type==='in'?'+':'-'}${formatRupiah(i.amount)}
      </div>
      <div class="item-meta">${formatDate(i.createdAt)}</div>
    </div>
  `).join('');
};


// ========= INIT =========
window.addEventListener('load', async()=>{
  await openDB();
  populateUserFilters();
  const u=getUser();
  if(u) showApp(u);
});
</script>

</body>
</html>
