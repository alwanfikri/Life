<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Shared Life</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
</head>

<body>

<nav id="main-nav" style="display:none;">
  <div class="nav-brand">Shared Life</div>

  <div class="nav-tabs">
    <button class="nav-tab active" data-page="home">Home</button>
    <button class="nav-tab" data-page="journal">Journal</button>
    <button class="nav-tab" data-page="schedule">Schedule</button>
    <button class="nav-tab" data-page="finance">Finance</button>
    <button class="nav-tab" data-page="settings">Settings</button>
  </div>

  <div class="nav-user">
    <span id="nav-username"></span>
    <button onclick="logout()">Logout</button>
    <button onclick="syncNow(event)">Sync</button>
  </div>
</nav>


<div class="page-container">

  <!-- LANDING -->
  <div id="landing-page" class="tab-page active">
    <div class="form-card">
      <h2>Selamat datang 👋</h2>
      <p>Masukkan nama kamu</p>

      <input id="username-input" placeholder="misal: fikri">

      <br><br>

      <button class="btn-primary" onclick="loginUser()">Masuk</button>

      <div id="recent-users" style="margin-top:16px;display:none;">
        <h4>Pengguna terakhir:</h4>
        <div id="user-chips"></div>
      </div>
    </div>
  </div>


  <!-- HOME -->
  <div id="home-page" class="tab-page">
    <h2>Dashboard</h2>

    <div class="dashboard-grid" style="margin-top:12px;">
      <div class="form-card">
        <h3>Journal</h3>
        <div id="journal-count" style="font-size:36px;">0</div>
      </div>

      <div class="form-card">
        <h3>Schedule</h3>
        <div id="schedule-count" style="font-size:36px;">0</div>
      </div>

      <div class="form-card">
        <h3>Transaksi</h3>
        <div id="finance-count" style="font-size:36px;">0</div>
      </div>
    </div>

    <div class="form-card">
      <h3>Ringkasan Hari Ini</h3>

      <p id="today-journal"></p>
      <p id="today-schedule"></p>
      <p id="today-income"></p>
      <p id="today-expense"></p>
    </div>
  </div>


  <!-- JOURNAL -->
  <div id="journal-page" class="tab-page">

    <div class="form-card">
      <h3>Journal Baru</h3>

      <textarea id="journal-text" placeholder="Tulis pikiranmu…"></textarea>

      <br>

      <label>
        <input type="checkbox" id="journal-shared">
        Shared
      </label>

      <br><br>

      <button class="btn-primary" onclick="addJournalEntry()">Simpan</button>
    </div>

    <div id="journal-list"></div>
  </div>


  <!-- SCHEDULE -->
  <div id="schedule-page" class="tab-page">

    <div class="form-card">
      <h3>Jadwal Baru</h3>

      <input id="schedule-title" placeholder="Judul">
      <br><br>

      <input id="schedule-category" placeholder="Kategori (opsional)">
      <br><br>

      <label>Mulai</label>
      <input id="schedule-start" type="datetime-local">
      <br><br>

      <label>Selesai</label>
      <input id="schedule-end" type="datetime-local">
      <br><br>

      <label>
        <input type="checkbox" id="schedule-shared">
        Shared
      </label>

      <br><br>

      <button class="btn-primary" onclick="addScheduleEntry()">Simpan</button>
    </div>

    <div id="schedule-list"></div>
  </div>


  <!-- FINANCE -->
  <div id="finance-page" class="tab-page">

    <div id="balance-display"></div>

    <div class="form-card">
      <h3>Transaksi Baru</h3>

      <input id="finance-amount" type="number" placeholder="Jumlah">
      <br><br>

      <select id="finance-type">
        <option value="in">Pemasukan</option>
        <option value="out">Pengeluaran</option>
      </select>
      <br><br>

      <input id="finance-category" placeholder="Kategori (opsional)">
      <br><br>

      <label>
        <input type="checkbox" id="finance-shared">
        Shared
      </label>

      <br><br>

      <button class="btn-primary" onclick="addFinanceEntry()">Simpan</button>
    </div>

    <div class="form-card">
      <h3>Filter</h3>

      <input id="finance-filter-category" placeholder="Cari kategori">
      <br><br>

      <select id="finance-filter-user">
        <option value="">Semua</option>
      </select>
      <br><br>

      <select id="finance-filter-shared">
        <option value="">Semua</option>
        <option value="true">Shared</option>
        <option value="false">Pribadi</option>
      </select>
      <br><br>

      <button class="btn-primary" onclick="loadFinanceData()">Terapkan</button>
    </div>

    <div id="finance-list"></div>
  </div>


  <!-- SETTINGS -->
  <div id="settings-page" class="tab-page">

    <div class="form-card">
      <h3>User Terdaftar</h3>
      <div id="user-list"></div>
    </div>

    <div class="form-card">
      <h3>Ganti Nama User Aktif</h3>

      <input id="rename-input" placeholder="Nama baru">
      <br><br>

      <button class="btn-primary" onclick="renameUser()">Ganti</button>
    </div>

    <div class="form-card">
      <h3>Reset Semua Data</h3>

      <button class="btn-primary" style="background:#d32f2f"
        onclick="resetAllData()">
        Hapus Semua Data
      </button>
    </div>

  </div>

</div>


<script type="module" src="js/app.js"></script>


<script type="module">
import { addJournal } from "./js/journal.js";
import { addSchedule } from "./js/schedule.js";
import { addFinance } from "./js/finance.js";
import { openDB } from "./js/db.js";
import { setUser, getUser } from "./js/users.js";


/* ========= HELPERS ========= */

function formatRupiah(num){
  return new Intl.NumberFormat("id-ID",{
    style:"currency",
    currency:"IDR",
    minimumFractionDigits:0
  }).format(num);
}

function formatDateTime(d){
  return new Date(d).toLocaleString("id-ID",{
    weekday:"long",
    year:"numeric",
    month:"long",
    day:"numeric",
    hour:"2-digit",
    minute:"2-digit"
  });
}

function formatDate(d){
  return new Date(d).toLocaleDateString("id-ID",{
    weekday:"long",
    year:"numeric",
    month:"long",
    day:"numeric"
  });
}

function isToday(ts){
  const d=new Date(ts);
  const n=new Date();
  return d.getDate()==n.getDate()
    && d.getMonth()==n.getMonth()
    && d.getFullYear()==n.getFullYear();
}


/* ========= SMALL DB HELPER ========= */

async function getAll(db,store){
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(store,"readonly");
    const req=tx.objectStore(store).getAll();
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}


/* ========= NAVIGATION ========= */

document.querySelectorAll(".nav-tab").forEach(tab=>{
  tab.addEventListener("click",()=>navigateTo(tab.dataset.page));
});

window.navigateTo = page =>{
  document.querySelectorAll(".nav-tab")
    .forEach(t=>t.classList.toggle("active",t.dataset.page===page));

  document.querySelectorAll(".tab-page")
    .forEach(p=>p.classList.remove("active"));

  document.getElementById(page+"-page").classList.add("active");

  if(page==="home") loadDashboard();
  if(page==="journal") loadJournalData();
  if(page==="schedule") loadScheduleData();
  if(page==="finance") loadFinanceData();
  if(page==="settings") loadUserList();
};


/* ========= USER HANDLING ========= */

function populateUserFilters(){
  const users = JSON.parse(localStorage.getItem("recentUsers")||"[]");
  const sel = document.getElementById("finance-filter-user");
  sel.innerHTML=`<option value="">Semua</option>`;
  users.forEach(u=>{
    const o=document.createElement("option");
    o.value=u;
    o.textContent=u;
    sel.appendChild(o);
  });
}

window.loginUser = ()=>{
  const u=document.getElementById("username-input").value.trim();
  if(!u) return;

  setUser(u);

  let r=JSON.parse(localStorage.getItem("recentUsers")||"[]");
  r=[u,...r.filter(x=>x!==u)].slice(0,5);
  localStorage.setItem("recentUsers",JSON.stringify(r));

  showApp(u);
};

window.logout = ()=>{
  document.getElementById("main-nav").style.display="none";
  navigateTo("landing");
};

function showApp(username){
  document.getElementById("landing-page").classList.remove("active");
  document.getElementById("home-page").classList.add("active");
  document.getElementById("main-nav").style.display="flex";
  document.getElementById("nav-username").textContent=username;

  populateUserFilters();
  loadDashboard();
}


/* ========= DASHBOARD ========= */

window.loadDashboard = async ()=>{
  const db=await openDB();

  const journals = await getAll(db,"journals");
  const schedules = await getAll(db,"schedules");
  const finance = await getAll(db,"finance");

  document.getElementById("journal-count").textContent=journals.length;
  document.getElementById("schedule-count").textContent=schedules.length;
  document.getElementById("finance-count").textContent=finance.length;

  const todayJournal = journals.filter(j=>isToday(j.createdAt)).length;
  const todaySchedule = schedules.filter(s=>isToday(s.start)).length;
  const todayIncome = finance.filter(f=>isToday(f.createdAt)&&f.type==="in").reduce((s,f)=>s+f.amount,0);
  const todayExpense = finance.filter(f=>isToday(f.createdAt)&&f.type==="out").reduce((s,f)=>s+f.amount,0);

  document.getElementById("today-journal").textContent=`Journal: ${todayJournal}`;
  document.getElementById("today-schedule").textContent=`Schedule: ${todaySchedule}`;
  document.getElementById("today-income").textContent=`Pemasukan: ${formatRupiah(todayIncome)}`;
  document.getElementById("today-expense").textContent=`Pengeluaran: ${formatRupiah(todayExpense)}`;
};


/* ========= JOURNAL ========= */

window.addJournalEntry = async ()=>{
  const text=document.getElementById("journal-text").value.trim();
  const shared=document.getElementById("journal-shared").checked;

  if(!text) return;

  await addJournal(text,shared);

  document.getElementById("journal-text").value="";

  loadJournalData();
};

window.loadJournalData = async ()=>{
  const db=await openDB();
  const list=document.getElementById("journal-list");

  const items=(await getAll(db,"journals")).sort((a,b)=>b.createdAt-a.createdAt);

  list.innerHTML = items.map(i=>`
    <div class="item-card ${i.shared?"shared":""}">
      <div class="item-badges">
        <span class="item-badge">${i.owner}</span>
        ${i.shared?'<span class="item-badge shared">Shared</span>':""}
      </div>
      <p>${i.text}</p>
      <div class="item-meta">${formatDateTime(i.createdAt)}</div>
    </div>
  `).join("");
};


/* ========= SCHEDULE ========= */

window.addScheduleEntry = async ()=>{
  await addSchedule(
    document.getElementById("schedule-title").value,
    document.getElementById("schedule-start").value,
    document.getElementById("schedule-end").value,
    document.getElementById("schedule-category").value,
    document.getElementById("schedule-shared").checked
  );

  loadScheduleData();
};

window.loadScheduleData = async ()=>{
  const db=await openDB();
  const list=document.getElementById("schedule-list");

  const items=(await getAll(db,"schedules")).sort((a,b)=>new Date(a.start)-new Date(b.start));

  list.innerHTML = items.map(i=>`
    <div class="item-card ${i.shared?"shared":""}">
      <div class="item-badges">
        <span class="item-badge">${i.owner}</span>
        ${i.category?`<span class="item-badge">${i.category}</span>`:""}
      </div>

      <h4>${i.title}</h4>

      <div class="item-meta">
        ${formatDateTime(i.start)} – ${formatDateTime(i.end)}
      </div>
    </div>
  `).join("");
};


/* ========= FINANCE ========= */

window.addFinanceEntry = async ()=>{
  await addFinance(
    parseFloat(document.getElementById("finance-amount").value),
    document.getElementById("finance-type").value,
    document.getElementById("finance-category").value,
    document.getElementById("finance-shared").checked
  );

  loadFinanceData();
};

window.loadFinanceData = async ()=>{
  const db=await openDB();
  const list=document.getElementById("finance-list");
  const balance=document.getElementById("balance-display");
  const user=getUser();

  const items=await getAll(db,"finance");

  const shared = items.reduce((s,i)=>s+(i.shared?(i.type==="in"?i.amount:-i.amount):0),0);
  const mine = items.reduce((s,i)=>s+(!i.shared&&i.owner===user?(i.type==="in"?i.amount:-i.amount):0),0);

  balance.innerHTML=`
    <div class="balance-card">
      <div>Saldo Shared: <b>${formatRupiah(shared)}</b></div>
      <div>Saldo Kamu: <b>${formatRupiah(mine)}</b></div>
      <div>Total Kamu: <b>${formatRupiah(shared+mine)}</b></div>
    </div>
  `;

  list.innerHTML = items
    .sort((a,b)=>b.createdAt-a.createdAt)
    .map(i=>`
      <div class="item-card ${i.shared?"shared":""}">
        <div class="item-badges">
          <span class="item-badge">${i.owner}</span>
          ${i.category?`<span class="item-badge">${i.category}</span>`:""}
        </div>

        <div class="amount ${i.type==="in"?"income":"expense"}">
          ${i.type==="in"?"+":"-"}${formatRupiah(i.amount)}
        </div>

        <div class="item-meta">${formatDate(i.createdAt)}</div>
      </div>
    `).join("");
};


/* ========= SETTINGS ========= */

window.loadUserList = ()=>{
  const users = JSON.parse(localStorage.getItem("recentUsers")||"[]");
  const box = document.getElementById("user-list");

  box.innerHTML = users.map(u=>`
    <div class="item-card">${u}</div>
  `).join("");
};

window.renameUser = ()=>{
  const newName=document.getElementById("rename-input").value.trim();
  if(!newName) return alert("Nama tidak boleh kosong");

  const old=getUser();

  localStorage.setItem("activeUser",newName);

  let users=JSON.parse(localStorage.getItem("recentUsers")||"[]");
  users=[newName,...users.filter(x=>x!==old)];
  localStorage.setItem("recentUsers",JSON.stringify(users));

  alert("Nama diganti");
  location.reload();
};

window.resetAllData = ()=>{
  if(!confirm("Yakin hapus SEMUA data?")) return;

  indexedDB.deleteDatabase("life_beta");
  localStorage.removeItem("recentUsers");
  localStorage.removeItem("activeUser");

  alert("Data dihapus");
  location.reload();
};


/* ========= INIT ========= */

window.addEventListener("load", async()=>{
  await openDB();
  populateUserFilters();

  const u=getUser();
  if(u) showApp(u);
});
</script>

</body>
</html>
